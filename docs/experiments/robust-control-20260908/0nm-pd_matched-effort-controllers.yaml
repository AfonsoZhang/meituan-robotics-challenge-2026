controller_manager:
  ros__parameters:
    update_rate: 1000
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: meituan_robust_control/GravitySlidingController
joint_trajectory_controller:
  ros__parameters:
    joints:
    - shoulder_joint
    - upperArm_joint
    - foreArm_joint
    - wrist1_joint
    - wrist2_joint
    - wrist3_joint
    command_interfaces:
    - effort
    state_interfaces:
    - position
    - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
    open_loop_control: false
    gains:
      shoulder_joint:
        p: 700.0
        i: 0.0
        d: 80.0
        ff_velocity_scale: 0.0
      upperArm_joint:
        p: 700.0
        i: 0.0
        d: 80.0
        ff_velocity_scale: 0.0
      foreArm_joint:
        p: 465.0
        i: 0.0
        d: 57.5
        ff_velocity_scale: 0.0
      wrist1_joint:
        p: 45.0
        i: 0.0
        d: 3.7
        ff_velocity_scale: 0.0
      wrist2_joint:
        p: 27.5
        i: 0.0
        d: 1.85
        ff_velocity_scale: 0.0
      wrist3_joint:
        p: 8.0
        i: 0.0
        d: 0.43333333333333335
        ff_velocity_scale: 0.0
    robust.enabled: false
    robust.model_file: /home/afonso/meituan-robotics-challenge-2026/outputs/robust-control-20260908/0nm-pd_matched/robot.urdf
