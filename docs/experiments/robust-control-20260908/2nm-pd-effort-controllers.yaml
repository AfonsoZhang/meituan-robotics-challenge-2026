controller_manager:
  ros__parameters:
    update_rate: 1000
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: meituan_robust_control/GravitySlidingController
joint_trajectory_controller:
  ros__parameters:
    joints:
    - shoulder_joint
    - upperArm_joint
    - foreArm_joint
    - wrist1_joint
    - wrist2_joint
    - wrist3_joint
    command_interfaces:
    - effort
    state_interfaces:
    - position
    - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
    open_loop_control: false
    gains:
      shoulder_joint:
        p: 400.0
        i: 0.0
        d: 30.0
        ff_velocity_scale: 0.0
      upperArm_joint:
        p: 400.0
        i: 0.0
        d: 30.0
        ff_velocity_scale: 0.0
      foreArm_joint:
        p: 240.0
        i: 0.0
        d: 20.0
        ff_velocity_scale: 0.0
      wrist1_joint:
        p: 30.0
        i: 0.0
        d: 1.2
        ff_velocity_scale: 0.0
      wrist2_joint:
        p: 20.0
        i: 0.0
        d: 0.6
        ff_velocity_scale: 0.0
      wrist3_joint:
        p: 6.0
        i: 0.0
        d: 0.1
        ff_velocity_scale: 0.0
    robust.enabled: false
    robust.model_file: /home/afonso/meituan-robotics-challenge-2026/outputs/robust-control-20260908/2nm-pd/robot.urdf
